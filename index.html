<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>INVENTORY COUNTING SYSTEM</title>

<!-- ============================================================
     EXCEL LIBRARY
============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>


<style>

/* ============================================================
   BODY
============================================================ */

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
  color:#111;
}


/* ============================================================
   CONTAINER
============================================================ */

.container{
  max-width:1300px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}


/* ============================================================
   TITLE
============================================================ */

h2{
  margin-top:0;
}


/* ============================================================
   INPUT
============================================================ */

.scan-row{
  display:flex;
  gap:15px;
  margin-bottom:15px;
}

input,
select{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  box-sizing:border-box;
}


/* ============================================================
   BUTTON
============================================================ */

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.del-btn{
  background:#ef4444;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
}


/* ============================================================
   TABLE
============================================================ */

.table-container{
  margin-top:20px;
  max-height:420px;
  overflow:auto;
  border:1px solid #ddd;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #e5e7eb;
  padding:8px;
  font-size:13px;
  white-space:nowrap;
}

th{
  background:#f1f5f9;
  position:sticky;
  top:0;
  z-index:10;
}

.latest{
  background:#fff7cc;
}


/* ============================================================
   SUMMARY DASHBOARD
============================================================ */

#summaryWrapper{
  margin-top:20px;
  border:1px solid #ddd;
  border-radius:10px;
  max-height:350px;
  overflow-y:auto;
  padding:12px;
  background:#fafafa;
}

.summary-box{
  background:#fff;
  border:2px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  transition:0.2s;
}

.summary-focus{
  border:2px solid #2563eb;
  background:#eff6ff;
  box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.summary-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.total-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ddd;
  font-weight:bold;
}


/* ============================================================
   ALERT
============================================================ */

#duplicateAlert{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

</style>

</head>


<body>

<div class="container">

<h2>📦 INVENTORY COUNT SYSTEM</h2>


<!-- ============================================================
     SCAN INPUT
============================================================ -->

<div class="scan-row">

<select id="rowSelect"></select>

<input
  id="qrInput"
  placeholder="Scan QR Code..."
  autofocus
/>

</div>


<!-- ============================================================
     DUPLICATE ALERT
============================================================ -->

<div id="duplicateAlert">
  ⚠ Duplicate Item
</div>


<!-- ============================================================
     BUTTON
============================================================ -->

<button
  class="btn-blue"
  onclick="exportExcel()"
>
  Export Excel
</button>


<button
  class="btn-red"
  onclick="clearAll()"
>
  Clear
</button>


<!-- ============================================================
     SCAN TABLE

     Qty ถูกลบออกจากการแสดงผลหน้าเว็บ
     แต่ Qty ยังอยู่ใน data และ RawData
============================================================ -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Row</th>

<th>No</th>

<th>Line</th>

<th>Location</th>

<th>Part</th>

<th>PO</th>

<th>LOT</th>

<th>Remark</th>

<th>Time</th>

<th>Action</th>

</tr>

</thead>


<tbody id="tb"></tbody>


</table>

</div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div id="summaryWrapper">

<div id="summary"></div>

</div>


</div>


<script>


/* ============================================================
   GLOBAL
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   DOM ELEMENT
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


/* ============================================================
   CREATE ROW SELECT
============================================================ */

for(let i = 1; i <= 50; i++){

  rowSelect.innerHTML += `
    <option value="${i}">
      Row ${i}
    </option>
  `;

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(
  "keypress",
  e => {

    if(e.key === "Enter"){

      scan(qr.value);

      qr.value = "";

    }

  }
);


/* ============================================================
   SCAN FUNCTION
============================================================ */

function scan(v){

  document
    .getElementById("duplicateAlert")
    .style.display = "none";


  /* ------------------------------------------------------------
     Validate Empty QR
  ------------------------------------------------------------ */

  if(!v || !v.trim()){

    qr.focus();

    return;

  }


  v = v.trim();


  /* ------------------------------------------------------------
     Duplicate QR
  ------------------------------------------------------------ */

  if(scanned.includes(v)){

    document
      .getElementById("duplicateAlert")
      .style.display = "block";

    qr.focus();

    return;

  }


  /* ------------------------------------------------------------
     Save Scanned QR
  ------------------------------------------------------------ */

  scanned.push(v);


  /* ------------------------------------------------------------
     Split QR
  ------------------------------------------------------------ */

  const d =
    v.split("|");


  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  /* ------------------------------------------------------------
     QR DATA
     
     ตำแหน่งเดิมของระบบ
  ------------------------------------------------------------ */

  const line =
    d[1] || "-";


  const location =
    d[2] || "-";


  const part =
    d[4] || "-";


  const qty =
    parseInt(d[5]) || 0;


  const po =
    d[7] || "-";


  const lot =
    d[8] || "-";


  /* ------------------------------------------------------------
     TIME
  ------------------------------------------------------------ */

  const time =
    new Date().toLocaleString();


  /* ============================================================
     REMARK
  ============================================================ */

  let duplicateRows = [];


  data.forEach(item => {

    if(
      item.part === part &&
      item.row !== row &&
      !duplicateRows.includes(item.row)
    ){

      duplicateRows.push(
        item.row
      );

    }

  });


  let remark = "";


  if(duplicateRows.length > 0){

    remark =
      "ข้อมูล Part item ซ้ำกับแถว " +
      duplicateRows.join(", ");

  }


  /* ============================================================
     PUSH DATA

     Qty ยังคงเก็บไว้ตรงนี้
     แม้จะไม่แสดงในหน้าเว็บ
  ============================================================ */

  data.push({

    row: row,

    line: line,

    location: location,

    part: part,

    qty: qty,

    po: po,

    lot: lot,

    remark: remark,

    time: time,

    key: v

  });


  /* ------------------------------------------------------------
     Render
  ------------------------------------------------------------ */

  render();


  /* ------------------------------------------------------------
     Focus Scanner
  ------------------------------------------------------------ */

  qr.focus();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach((x, i) => {

    tb.innerHTML += `

      <tr class="${i === data.length - 1 ? 'latest' : ''}">

        <td>
          ${escapeHtml(x.row)}
        </td>

        <td>
          ${i + 1}
        </td>

        <td>
          ${escapeHtml(x.line)}
        </td>

        <td>
          ${escapeHtml(x.location)}
        </td>

        <td>
          ${escapeHtml(x.part)}
        </td>

        <td>
          ${escapeHtml(x.po)}
        </td>

        <td>
          ${escapeHtml(x.lot)}
        </td>

        <td>
          ${escapeHtml(x.remark)}
        </td>

        <td>
          ${escapeHtml(x.time)}
        </td>

        <td>

          <button
            class="del-btn"
            onclick="del(${i})"
          >
            Delete
          </button>

        </td>

      </tr>

    `;

  });


  /* ============================================================
     TABLE AUTO SCROLL
  ============================================================ */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ============================================================
     SUMMARY
  ============================================================ */

  renderSummary();

}


/* ============================================================
   HTML SAFE
============================================================ */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   DELETE
============================================================ */

function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  scanned =
    scanned.filter(
      x => x !== data[i].key
    );


  data.splice(i, 1);


  render();

}


/* ============================================================
   SUMMARY DASHBOARD
     
   Row เดียวกัน
   Part ชื่อเดียวกัน
   => รวมเป็น 1 รายการ
     
   Unit = จำนวนครั้งที่ Part ถูก Scan
     
   Qty = ผลรวม Qty จริงทั้งหมด
============================================================ */

function renderSummary(){

  /* ------------------------------------------------------------
     Summary Object
  ------------------------------------------------------------ */

  let summaryData = {};


  /* ------------------------------------------------------------
     Group By Row + Part
  ------------------------------------------------------------ */

  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(x.part || "-").trim();


    if(!summaryData[row]){

      summaryData[row] = {};

    }


    if(!summaryData[row][part]){

      summaryData[row][part] = {

        unit: 0,

        qty: 0

      };

    }


    /* ----------------------------------------------------------
       Unit

       จำนวนครั้งที่ Part ถูก Scan
    ---------------------------------------------------------- */

    summaryData[row][part].unit++;


    /* ----------------------------------------------------------
       Qty

       รวม Qty ของทุก Scan
    ---------------------------------------------------------- */

    const currentQty =
      Number(x.qty);


    if(Number.isFinite(currentQty)){

      summaryData[row][part].qty +=
        currentQty;

    }

  });


  /* ------------------------------------------------------------
     Empty
  ------------------------------------------------------------ */

  if(
    Object.keys(summaryData).length === 0
  ){

    document.getElementById("summary").innerHTML =
      "";

    return;

  }


  /* ------------------------------------------------------------
     HTML
  ------------------------------------------------------------ */

  let html = "";


  Object.keys(summaryData)
    .sort(
      (a,b) =>
        Number(a) - Number(b)
    )
    .forEach(r => {

      let totalUnit = 0;

      let totalQty = 0;


      html += `

        <div class="
          summary-box
          ${latestRowFocus == r
            ? 'summary-focus'
            : ''}
        ">

          <div class="summary-title">
            📍 Row ${escapeHtml(r)}
          </div>


          <table
            style="
              width:100%;
              border-collapse:collapse;
            "
          >

            <thead>

              <tr>

                <th>
                  Part
                </th>

                <th>
                  Unit
                </th>

                <th>
                  Qty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      /* ----------------------------------------------------------
         Parts
      ---------------------------------------------------------- */

      Object.keys(summaryData[r])
        .forEach(p => {


          const unit =
            summaryData[r][p].unit;


          const qty =
            summaryData[r][p].qty;


          totalUnit +=
            unit;


          totalQty +=
            qty;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                ${unit}
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                ${qty}
              </td>

            </tr>

          `;

        });


      /* ----------------------------------------------------------
         TOTAL
      ---------------------------------------------------------- */

      html += `

            </tbody>


            <tfoot>

              <tr>

                <td>
                  <b>TOTAL</b>
                </td>

                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalUnit}
                  </b>
                </td>

                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalQty}
                  </b>
                </td>

              </tr>

            </tfoot>

          </table>


        </div>

      `;

    });


  /* ------------------------------------------------------------
     Display
  ------------------------------------------------------------ */

  document.getElementById("summary").innerHTML =
    html;

}


/* ============================================================
   CLEAR
============================================================ */

function clearAll(){

  data = [];

  scanned = [];

  latestRowFocus = "";


  tb.innerHTML =
    "";


  document.getElementById("summary").innerHTML =
    "";


  document
    .getElementById("duplicateAlert")
    .style.display =
    "none";


  qr.focus();

}


/* ============================================================
   EXPORT EXCEL
============================================================ */

function exportExcel(){

  /* ------------------------------------------------------------
     Create Workbook
  ------------------------------------------------------------ */

  let wb =
    XLSX.utils.book_new();


  /* ============================================================
     RAW DATA

     Qty ยังอยู่ใน RawData
     และยังใช้ Qty จาก QR เหมือนเดิม
  ============================================================ */

  let rawData = data.map(x => ({

    Row: x.row,

    Line: x.line,

    Location: x.location,

    Part: x.part,

    Qty: Number(x.qty) || 0,

    PO: x.po,

    LOT: x.lot,

    Remark: x.remark,

    Time: x.time

  }));


  let ws1 =
    XLSX.utils.json_to_sheet(
      rawData
    );


  XLSX.utils.book_append_sheet(
    wb,
    ws1,
    "RawData"
  );


  /* ============================================================
     SUMMARY

     Group:
       Row + Part

     Unit:
       จำนวนครั้งที่ Scan

     LOT:
       ค่า LOT จาก QR

     Qty:
       LOT × Unit
  ============================================================ */

  let summaryData = {};


  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(x.part || "-").trim();


    if(!summaryData[row]){

      summaryData[row] = {};

    }


    if(!summaryData[row][part]){

      summaryData[row][part] = {

        unit: 0,

        lot: 0

      };

    }


    /* ----------------------------------------------------------
       Unit

       จำนวนครั้งที่ Scan
    ---------------------------------------------------------- */

    summaryData[row][part].unit++;


    /* ----------------------------------------------------------
       LOT

       ดึงค่า LOT จาก QR
    ---------------------------------------------------------- */

    const lot =
      Number(x.lot);


    if(Number.isFinite(lot)){

      summaryData[row][part].lot =
        lot;

    }

  });


  /* ============================================================
     BUILD SUMMARY SHEET
     
     Qty = LOT × Unit
  ============================================================ */

  let summarySheet = [];


  Object.keys(summaryData)
    .sort(
      (a,b) =>
        Number(a) - Number(b)
    )
    .forEach(r => {


      let totalUnit = 0;

      let totalQty = 0;


      Object.keys(summaryData[r])
        .forEach(p => {


          const unit =
            summaryData[r][p].unit;


          const lot =
            summaryData[r][p].lot;


          /* ----------------------------------------------------
             IMPORTANT

             Qty = LOT × Unit
          ---------------------------------------------------- */

          const qty =
            lot * unit;


          totalUnit +=
            unit;


          totalQty +=
            qty;


          summarySheet.push({

            Row: r,

            Part: p,

            LOT: lot,

            Unit: unit,

            Qty: qty

          });

        });


      /* --------------------------------------------------------
         TOTAL
      -------------------------------------------------------- */

      summarySheet.push({

        Row: r,

        Part: "TOTAL",

        LOT: "",

        Unit: totalUnit,

        Qty: totalQty

      });

    });


  /* ============================================================
     CREATE SUMMARY WORKSHEET
  ============================================================ */

  let ws2 =
    XLSX.utils.json_to_sheet(
      summarySheet
    );


  /* ============================================================
     SUMMARY STYLE
  ============================================================ */

  if(ws2["!ref"]){

    let range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = range.s.r;
      R <= range.e.r;
      R++
    ){

      for(
        let C = range.s.c;
        C <= range.e.c;
        C++
      ){

        let addr =
          XLSX.utils.encode_cell({

            r:R,

            c:C

          });


        let cell =
          ws2[addr];


        if(!cell)
          continue;


        /* ------------------------------------------------------
           HEADER
        ------------------------------------------------------ */

        if(R === 0){

          cell.s = {

            font:{

              bold:true,

              color:{

                rgb:"FFFFFF"

              }

            },

            fill:{

              fgColor:{

                rgb:"4472C4"

              }

            }

          };

        }


        /* ------------------------------------------------------
           TOTAL
        ------------------------------------------------------ */

        if(cell.v === "TOTAL"){

          /*

             Summary มี 5 Columns:

             Row
             Part
             LOT
             Unit
             Qty

          */

          for(
            let i = 0;
            i <= 4;
            i++
          ){

            let totalAddr =
              XLSX.utils.encode_cell({

                r:R,

                c:i

              });


            if(ws2[totalAddr]){

              ws2[totalAddr].s = {

                font:{

                  bold:true

                },

                fill:{

                  fgColor:{

                    rgb:"B7DEE8"

                  }

                }

              };

            }

          }

        }

      }

    }

  }


  /* ============================================================
     AUTO WIDTH
  ============================================================ */

  let cols = [];


  summarySheet.forEach(row => {

    Object.keys(row)
      .forEach((k,i) => {

        let len =
          String(
            row[k]
          ).length;


        if(!cols[i]){

          cols[i] = {

            wch:10

          };

        }


        if(
          len >
          cols[i].wch
        ){

          cols[i].wch =
            len + 4;

        }

      });

  });


  ws2["!cols"] =
    cols;


  /* ============================================================
     APPEND SUMMARY
  ============================================================ */

  XLSX.utils.book_append_sheet(
    wb,
    ws2,
    "Summary"
  );


  /* ============================================================
     DOWNLOAD
  ============================================================ */

  XLSX.writeFile(
    wb,
    "inventory_report.xlsx"
  );

}

</script>


</body>
</html>
