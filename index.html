<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>INVENTORY COUNTING SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
  color:#111;
}

.container{
  max-width:1300px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h2{
  margin-top:0;
}

.scan-row{
  display:flex;
  gap:15px;
  margin-bottom:15px;
}

input,
select{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  box-sizing:border-box;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.del-btn{
  background:#ef4444;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
}

.table-container{
  margin-top:20px;
  max-height:420px;
  overflow:auto;
  border:1px solid #ddd;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #e5e7eb;
  padding:8px;
  font-size:13px;
  white-space:nowrap;
}

th{
  background:#f1f5f9;
  position:sticky;
  top:0;
  z-index:10;
}

.latest{
  background:#fff7cc;
}

#summaryWrapper{
  margin-top:20px;
  border:1px solid #ddd;
  border-radius:10px;
  max-height:350px;
  overflow-y:auto;
  padding:12px;
  background:#fafafa;
}

.summary-box{
  background:#fff;
  border:2px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  transition:0.2s;
}

.summary-focus{
  border:2px solid #2563eb;
  background:#eff6ff;
  box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.summary-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.total-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ddd;
  font-weight:bold;
}

#duplicateAlert{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>📦 INVENTORY COUNT SYSTEM</h2>

<div class="scan-row">

<select id="rowSelect"></select>

<input
  id="qrInput"
  placeholder="Scan QR Code..."
  autofocus
/>

</div>

<div id="duplicateAlert">
  ⚠ Duplicate Item
</div>

<button
  class="btn-blue"
  onclick="exportExcel()"
>
  Export Excel
</button>

<button
  class="btn-red"
  onclick="clearAll()"
>
  Clear
</button>


<!-- ============================================================
     SCAN TABLE
============================================================ -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Row</th>

<th>No</th>

<th>Line</th>

<th>Location</th>

<th>Part</th>

<th>Q'ty</th>

<th>PO</th>

<th>LOT</th>

<th>Remark</th>

<th>Time</th>

<th>Action</th>

</tr>

</thead>

<tbody id="tb"></tbody>

</table>

</div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div id="summaryWrapper">

<div id="summary"></div>

</div>

</div>


<script>


/* ============================================================
   GLOBAL
============================================================ */

let data = [];

let scanned = [];

let latestRowFocus = "";


/* ============================================================
   DOM ELEMENT
============================================================ */

const tb =
  document.getElementById("tb");


const qr =
  document.getElementById("qrInput");


const rowSelect =
  document.getElementById("rowSelect");


/* ============================================================
   CREATE ROW SELECT
   Row 1 - 50
============================================================ */

for(let i = 1; i <= 50; i++){

  rowSelect.innerHTML += `
    <option value="${i}">
      Row ${i}
    </option>
  `;

}


/* ============================================================
   SCAN EVENT
============================================================ */

qr.addEventListener(
  "keypress",
  e => {

    if(e.key === "Enter"){

      scan(qr.value);

      qr.value = "";

    }

  }
);


/* ============================================================
   SCAN FUNCTION
============================================================ */

function scan(v){

  document
    .getElementById("duplicateAlert")
    .style.display = "none";


  /* ------------------------------------------------------------
     Validate Empty QR
  ------------------------------------------------------------ */

  if(!v || !v.trim()){

    qr.focus();

    return;

  }


  v = v.trim();


  /* ------------------------------------------------------------
     Duplicate QR
  ------------------------------------------------------------ */

  if(scanned.includes(v)){

    document
      .getElementById("duplicateAlert")
      .style.display = "block";

    qr.focus();

    return;

  }


  /* ------------------------------------------------------------
     Save Scanned QR
  ------------------------------------------------------------ */

  scanned.push(v);


  /* ------------------------------------------------------------
     Split QR
  ------------------------------------------------------------ */

  const d =
    v.split("|");


  const row =
    rowSelect.value;


  latestRowFocus =
    row;


  /* ------------------------------------------------------------
     QR DATA
  ------------------------------------------------------------ */

  const line =
    d[1] || "-";


  const location =
    d[2] || "-";


  const part =
    d[4] || "-";


  /* ------------------------------------------------------------
     Q'TY

     ตัวอย่าง:
     200073618|T|QC FACT 1|1|VG79Y417H01|53|...
                                                   ↑
                                                  Q'ty
  ------------------------------------------------------------ */

  const qty =
    parseInt(d[5]) || 0;


  const po =
    d[7] || "-";


  /* ------------------------------------------------------------
     LOT

     ตัวอย่าง:
     ...|9100003596|1930|
                          ↑
                         LOT
  ------------------------------------------------------------ */

  const lot =
    d[8] || "-";


  /* ------------------------------------------------------------
     TIME
  ------------------------------------------------------------ */

  const time =
    new Date().toLocaleString();


  /* ============================================================
     REMARK
  ============================================================ */

  let duplicateRows = [];


  data.forEach(item => {

    if(
      item.part === part &&
      item.row !== row &&
      !duplicateRows.includes(item.row)
    ){

      duplicateRows.push(
        item.row
      );

    }

  });


  let remark = "";


  if(duplicateRows.length > 0){

    remark =
      "ข้อมูล Part item ซ้ำกับแถว " +
      duplicateRows.join(", ");

  }


  /* ============================================================
     SAVE DATA
  ============================================================ */

  data.push({

    row: row,

    line: line,

    location: location,

    part: part,

    qty: qty,

    po: po,

    lot: lot,

    remark: remark,

    time: time,

    key: v

  });


  /* ------------------------------------------------------------
     Render
  ------------------------------------------------------------ */

  render();


  qr.focus();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function render(){

  tb.innerHTML = "";


  data.forEach((x, i) => {

    tb.innerHTML += `

      <tr class="${i === data.length - 1 ? 'latest' : ''}">

        <td>
          ${escapeHtml(x.row)}
        </td>

        <td>
          ${i + 1}
        </td>

        <td>
          ${escapeHtml(x.line)}
        </td>

        <td>
          ${escapeHtml(x.location)}
        </td>

        <td>
          ${escapeHtml(x.part)}
        </td>

        <td>
          ${escapeHtml(x.qty)}
        </td>

        <td>
          ${escapeHtml(x.po)}
        </td>

        <td>
          ${escapeHtml(x.lot)}
        </td>

        <td>
          ${escapeHtml(x.remark)}
        </td>

        <td>
          ${escapeHtml(x.time)}
        </td>

        <td>

          <button
            class="del-btn"
            onclick="del(${i})"
          >
            Delete
          </button>

        </td>

      </tr>

    `;

  });


  /* ============================================================
     TABLE AUTO SCROLL
  ============================================================ */

  const tableBox =
    document.querySelector(
      ".table-container"
    );


  if(tableBox){

    tableBox.scrollTop =
      tableBox.scrollHeight;

  }


  /* ============================================================
     SUMMARY
  ============================================================ */

  renderSummary();

}


/* ============================================================
   HTML SAFE
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   DELETE
============================================================ */

function del(i){

  if(
    i < 0 ||
    i >= data.length
  ){

    return;

  }


  scanned =
    scanned.filter(
      x => x !== data[i].key
    );


  data.splice(i, 1);


  render();

}


/* ============================================================
   SUMMARY DASHBOARD

   Row เดียวกัน
   Part เดียวกัน
   => รวมเป็น 1 รายการ

   Unit = จำนวนครั้งที่ Scan

   Q'ty = Q'ty ต่อ Scan × Unit

   ตัวอย่าง:

   Q'ty = 53
   Scan = 3 ครั้ง

   Total Q'ty = 53 × 3 = 159
============================================================ */

function renderSummary(){

  let summaryData = {};


  /* ------------------------------------------------------------
     Group By Row + Part
  ------------------------------------------------------------ */

  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(x.part || "-").trim();


    if(!summaryData[row]){

      summaryData[row] = {};

    }


    if(!summaryData[row][part]){

      summaryData[row][part] = {

        unit: 0,

        qty: 0

      };

    }


    /* ----------------------------------------------------------
       Unit
    ---------------------------------------------------------- */

    summaryData[row][part].unit++;


    /* ----------------------------------------------------------
       Q'ty

       รวม Q'ty จากแต่ละ Scan
    ---------------------------------------------------------- */

    const currentQty =
      Number(x.qty);


    if(Number.isFinite(currentQty)){

      summaryData[row][part].qty +=
        currentQty;

    }

  });


  /* ------------------------------------------------------------
     Empty
  ------------------------------------------------------------ */

  if(
    Object.keys(summaryData).length === 0
  ){

    document.getElementById("summary").innerHTML =
      "";

    return;

  }


  /* ------------------------------------------------------------
     HTML
  ------------------------------------------------------------ */

  let html = "";


  Object.keys(summaryData)
    .sort(
      (a,b) =>
        Number(a) - Number(b)
    )
    .forEach(r => {


      let totalUnit = 0;

      let totalQty = 0;


      html += `

        <div class="
          summary-box
          ${latestRowFocus == r
            ? 'summary-focus'
            : ''}
        ">

          <div class="summary-title">
            📍 Row ${escapeHtml(r)}
          </div>


          <table
            style="
              width:100%;
              border-collapse:collapse;
            "
          >

            <thead>

              <tr>

                <th>
                  Part
                </th>

                <th>
                  Unit
                </th>

                <th>
                  Q'ty
                </th>

              </tr>

            </thead>


            <tbody>

      `;


      /* ----------------------------------------------------------
         Parts
      ---------------------------------------------------------- */

      Object.keys(summaryData[r])
        .forEach(p => {


          const unit =
            summaryData[r][p].unit;


          const qty =
            summaryData[r][p].qty;


          totalUnit +=
            unit;


          totalQty +=
            qty;


          html += `

            <tr>

              <td>
                ${escapeHtml(p)}
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                ${unit}
              </td>

              <td
                style="
                  text-align:center;
                "
              >
                ${qty}
              </td>

            </tr>

          `;

        });


      /* ----------------------------------------------------------
         TOTAL
      ---------------------------------------------------------- */

      html += `

            </tbody>

            <tfoot>

              <tr>

                <td>
                  <b>TOTAL</b>
                </td>

                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalUnit}
                  </b>
                </td>

                <td
                  style="
                    text-align:center;
                  "
                >
                  <b>
                    ${totalQty}
                  </b>
                </td>

              </tr>

            </tfoot>

          </table>

        </div>

      `;

    });


  /* ------------------------------------------------------------
     Display
  ------------------------------------------------------------ */

  document.getElementById("summary").innerHTML =
    html;

}


/* ============================================================
   CLEAR
============================================================ */

function clearAll(){

  data = [];

  scanned = [];

  latestRowFocus = "";


  tb.innerHTML =
    "";


  document.getElementById("summary").innerHTML =
    "";


  document
    .getElementById("duplicateAlert")
    .style.display =
    "none";


  qr.focus();

}


/* ============================================================
   EXPORT EXCEL
============================================================ */

function exportExcel(){

  /* ------------------------------------------------------------
     Create Workbook
  ------------------------------------------------------------ */

  let wb =
    XLSX.utils.book_new();


  /* ============================================================
     RAW DATA

     Q'ty จาก QR โดยตรง
     เช่น d[5] = 53
  ============================================================ */

  let rawData = data.map(x => ({

    Row: x.row,

    Line: x.line,

    Location: x.location,

    Part: x.part,

    "Q'ty": Number(x.qty) || 0,

    PO: x.po,

    LOT: x.lot,

    Remark: x.remark,

    Time: x.time

  }));


  let ws1 =
    XLSX.utils.json_to_sheet(
      rawData
    );


  XLSX.utils.book_append_sheet(
    wb,
    ws1,
    "RawData"
  );


  /* ============================================================
     SUMMARY

     Group:
       Row + Part

     Unit:
       จำนวนครั้งที่ Scan

     Q'ty:
       ผลรวม Q'ty จากทุก Scan

     ตัวอย่าง:

       Q'ty = 53
       Unit = 3

       Summary Q'ty = 53 × 3
                    = 159
  ============================================================ */

  let summaryData = {};


  data.forEach(x => {

    const row =
      String(x.row);


    const part =
      String(x.part || "-").trim();


    if(!summaryData[row]){

      summaryData[row] = {};

    }


    if(!summaryData[row][part]){

      summaryData[row][part] = {

        unit: 0,

        qty: 0

      };

    }


    /* ----------------------------------------------------------
       Unit
    ---------------------------------------------------------- */

    summaryData[row][part].unit++;


    /* ----------------------------------------------------------
       Q'ty
    ---------------------------------------------------------- */

    const qty =
      Number(x.qty);


    if(Number.isFinite(qty)){

      summaryData[row][part].qty +=
        qty;

    }

  });


  /* ============================================================
     BUILD SUMMARY SHEET
  ============================================================ */

  let summarySheet = [];


  Object.keys(summaryData)
    .sort(
      (a,b) =>
        Number(a) - Number(b)
    )
    .forEach(r => {


      let totalUnit = 0;

      let totalQty = 0;


      Object.keys(summaryData[r])
        .forEach(p => {


          const unit =
            summaryData[r][p].unit;


          const qty =
            summaryData[r][p].qty;


          totalUnit +=
            unit;


          totalQty +=
            qty;


          summarySheet.push({

            Row: r,

            Part: p,

            Unit: unit,

            "Q'ty": qty

          });

        });


      /* --------------------------------------------------------
         TOTAL
      -------------------------------------------------------- */

      summarySheet.push({

        Row: r,

        Part: "TOTAL",

        Unit: totalUnit,

        "Q'ty": totalQty

      });

    });


  /* ============================================================
     CREATE SUMMARY WORKSHEET
  ============================================================ */

  let ws2 =
    XLSX.utils.json_to_sheet(
      summarySheet
    );


  /* ============================================================
     SUMMARY STYLE
  ============================================================ */

  if(ws2["!ref"]){

    let range =
      XLSX.utils.decode_range(
        ws2["!ref"]
      );


    for(
      let R = range.s.r;
      R <= range.e.r;
      R++
    ){

      for(
        let C = range.s.c;
        C <= range.e.c;
        C++
      ){

        let addr =
          XLSX.utils.encode_cell({

            r:R,

            c:C

          });


        let cell =
          ws2[addr];


        if(!cell)
          continue;


        /* ------------------------------------------------------
           HEADER
        ------------------------------------------------------ */

        if(R === 0){

          cell.s = {

            font:{

              bold:true,

              color:{

                rgb:"FFFFFF"

              }

            },

            fill:{

              fgColor:{

                rgb:"4472C4"

              }

            }

          };

        }


        /* ------------------------------------------------------
           TOTAL
        ------------------------------------------------------ */

        if(cell.v === "TOTAL"){

          for(
            let i = 0;
            i <= 3;
            i++
          ){

            let totalAddr =
              XLSX.utils.encode_cell({

                r:R,

                c:i

              });


            if(ws2[totalAddr]){

              ws2[totalAddr].s = {

                font:{

                  bold:true

                },

                fill:{

                  fgColor:{

                    rgb:"B7DEE8"

                  }

                }

              };

            }

          }

        }

      }

    }

  }


  /* ============================================================
     AUTO WIDTH
  ============================================================ */

  let cols = [];


  summarySheet.forEach(row => {

    Object.keys(row)
      .forEach((k,i) => {

        let len =
          String(
            row[k]
          ).length;


        if(!cols[i]){

          cols[i] = {

            wch:10

          };

        }


        if(
          len >
          cols[i].wch
        ){

          cols[i].wch =
            len + 4;

        }

      });

  });


  ws2["!cols"] =
    cols;


  /* ============================================================
     APPEND SUMMARY
  ============================================================ */

  XLSX.utils.book_append_sheet(
    wb,
    ws2,
    "Summary"
  );


  /* ============================================================
     DOWNLOAD
  ============================================================ */

  XLSX.writeFile(
    wb,
    "inventory_report.xlsx"
  );

}

</script>

</body>
</html>
